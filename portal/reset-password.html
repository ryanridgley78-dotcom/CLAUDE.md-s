<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set New Gate Password | YAH's Misfits</title>
    <meta name="description" content="Set a new YAH's Misfits gate password.">
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <meta name="theme-color" content="#163430">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="YHWH's Misfits">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="../styles.css?v=20260612-live-stream-visible-disabled">
  </head>
  <body class="inner-page portal-page">
    <header class="site-header" data-site-header>
      <a class="brand" href="../index.html" aria-label="YHWH's Misfits home">
        <span class="brand-mark" aria-hidden="true">YM</span>
        <span>YHWH's Misfits</span>
      </a>
    </header>

    <main>
      <section class="connect-section connect-page portal-shell" aria-labelledby="reset-password-title">
        <h2 id="reset-password-title">Set New Password</h2>
        <div class="connect-copy">
          <p>Create a new gate password.</p>
        </div>

        <form class="connect-form portal-form" data-password-reset-form>
          <p class="portal-message" data-password-reset-message hidden></p>
          <input type="hidden" name="token">
          <label>
            Email Address
            <input type="email" name="email" autocomplete="email" required>
          </label>
          <label>
            New Password
            <input type="password" name="password" autocomplete="new-password" required>
          </label>
          <label>
            Confirm Password
            <input type="password" name="confirm_password" autocomplete="new-password" required>
          </label>
          <label class="portal-show-password">
            <input type="checkbox" data-toggle-password>
            <span>Show passwords</span>
          </label>
          <button class="button primary" type="submit">Reset password</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; <span data-year></span> YAH's Misfits. All rights reserved.</p>
      <a href="mailto:yahwins@zohomail.com">yahwins@zohomail.com</a>
    </footer>

    <script src="../script.js?v=20260724-elder-nav-flow"></script>
    <script src="../assets/portal.js?v=20260702-preview-created-only"></script>
    <script src="/app-portal-cache.js?v=20260702-portal-network-first"></script>
  </body>
</html>
