<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Member Directory | YAH's Misfits</title>
    <meta name="description" content="Private YAH's Misfits qahal member directory.">
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <meta name="theme-color" content="#163430">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="YHWH's Misfits">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="../styles.css?v=20260612-live-stream-visible-disabled">
  </head>
  <body class="inner-page portal-page">
    <header class="site-header" data-site-header>
      <a class="brand" href="member.html" aria-label="YHWH's Misfits member home">
        <span class="brand-mark" aria-hidden="true">YM</span>
        <span>YHWH's Misfits</span>
      </a>
      <div class="header-actions" aria-label="Gate actions">
        <button class="header-button" type="button" data-portal-logout>Sign out</button>
      </div>
    </header>

    <main>
      <section class="connect-section connect-page portal-shell" aria-labelledby="member-directory">
        <h2 id="member-directory">Qahal Members</h2>
        <div class="connect-copy portal-welcome-copy">
          <p data-portal-welcome>Loading your account...</p>
        </div>

        <section class="portal-panel portal-next-steps portal-member-profile-panel" id="member-profile" aria-labelledby="member-profile-title">
          <h3 id="member-profile-title">My Directory Profile</h3>
          <p>Choose the picture and state information other qahal members can see.</p>
          <form class="portal-member-profile-form" data-member-profile-form>
            <p class="portal-message" data-member-profile-message hidden></p>
            <div class="portal-member-profile-grid">
              <div class="portal-member-avatar-card">
                <img class="portal-member-avatar-preview" data-member-avatar-preview alt="Your member profile picture" hidden>
                <span class="portal-member-avatar-placeholder" data-member-avatar-placeholder aria-hidden="true">YM</span>
                <div class="portal-member-avatar-controls">
                  <label class="portal-member-avatar-upload">
                    Profile Picture
                    <input type="file" name="profile_image" accept="image/png,image/jpeg,image/webp">
                  </label>
                  <button class="button secondary" type="button" data-remove-member-avatar>Remove picture</button>
                </div>
              </div>
              <div class="portal-member-location-card">
                <label>
                  Public State
                  <select name="public_location_state" data-member-location-state>
                    <option value="">Choose state</option>
                    <option value="AL">Alabama</option>
                    <option value="AK">Alaska</option>
                    <option value="AZ">Arizona</option>
                    <option value="AR">Arkansas</option>
                    <option value="CA">California</option>
                    <option value="CO">Colorado</option>
                    <option value="CT">Connecticut</option>
                    <option value="DE">Delaware</option>
                    <option value="FL">Florida</option>
                    <option value="GA">Georgia</option>
                    <option value="HI">Hawaii</option>
                    <option value="ID">Idaho</option>
                    <option value="IL">Illinois</option>
                    <option value="IN">Indiana</option>
                    <option value="IA">Iowa</option>
                    <option value="KS">Kansas</option>
                    <option value="KY">Kentucky</option>
                    <option value="LA">Louisiana</option>
                    <option value="ME">Maine</option>
                    <option value="MD">Maryland</option>
                    <option value="MA">Massachusetts</option>
                    <option value="MI">Michigan</option>
                    <option value="MN">Minnesota</option>
                    <option value="MS">Mississippi</option>
                    <option value="MO">Missouri</option>
                    <option value="MT">Montana</option>
                    <option value="NE">Nebraska</option>
                    <option value="NV">Nevada</option>
                    <option value="NH">New Hampshire</option>
                    <option value="NJ">New Jersey</option>
                    <option value="NM">New Mexico</option>
                    <option value="NY">New York</option>
                    <option value="NC">North Carolina</option>
                    <option value="ND">North Dakota</option>
                    <option value="OH">Ohio</option>
                    <option value="OK">Oklahoma</option>
                    <option value="OR">Oregon</option>
                    <option value="PA">Pennsylvania</option>
                    <option value="RI">Rhode Island</option>
                    <option value="SC">South Carolina</option>
                    <option value="SD">South Dakota</option>
                    <option value="TN">Tennessee</option>
                    <option value="TX">Texas</option>
                    <option value="UT">Utah</option>
                    <option value="VT">Vermont</option>
                    <option value="VA">Virginia</option>
                    <option value="WA">Washington</option>
                    <option value="WV">West Virginia</option>
                    <option value="WI">Wisconsin</option>
                    <option value="WY">Wyoming</option>
                    <option value="DC">Washington, DC</option>
                  </select>
                </label>
                <label class="portal-member-location-toggle">
                  <input type="checkbox" name="public_location_enabled" data-member-location-enabled>
                  <span>Show my state in the qahal member directory</span>
                </label>
                <button class="button primary" type="submit">Save directory profile</button>
              </div>
            </div>
          </form>
        </section>

        <section class="portal-panel portal-next-steps portal-member-directory" aria-label="Qahal member directory">
          <div class="portal-member-directory-list" data-member-directory-list>
            <p>Loading members...</p>
          </div>
        </section>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; <span data-year></span> YAH's Misfits. All rights reserved.</p>
      <a href="mailto:yahwins@zohomail.com">yahwins@zohomail.com</a>
    </footer>

    <script src="../script.js?v=20260724-elder-nav-flow"></script>
    <script src="../assets/portal.js?v=20260702-preview-created-only"></script>
    <script src="/app-portal-cache.js?v=20260702-portal-network-first"></script>
  </body>
</html>
